# ============================================================
# ADAPT — Backend CI/CD Pipeline
# ============================================================
# Triggers on push/PR to main.
# 1. Lint & test
# 2. Build & push Docker image
# 3. Deploy to production server via SSH
# ============================================================

name: Backend CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "Adapt_app/**"
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "Adapt_app/**"
      - "*.md"

env:
  DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/adapt-backend

jobs:
  # ── Lint & Test ─────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: adapt_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 black

      - name: Lint — flake8
        run: flake8 . --max-line-length=120 --exclude=.venv,migrations,__pycache__

      - name: Lint — black (check only)
        run: black --check --line-length=120 .

      - name: Run Django tests
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-for-production
          DJANGO_DEBUG: "1"
          POSTGRES_DB: adapt_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          GEMINI_API_KEY: test-key
        run: python manage.py test --verbosity=2

  # ── Build & Push Docker Image ───────────────────────────
  build:
    name: Build Docker Image
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

  # ── Deploy to Production ────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/adapt
            docker compose pull
            docker compose up -d --build
            docker compose exec -T web python manage.py migrate --noinput
            docker compose exec -T web python manage.py collectstatic --noinput
            echo "✅ Deployment complete — $(date)"
